name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp-build-test:
    name: C++ build + 10 GoogleTests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libmodbus
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libmodbus-dev pkg-config

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_DEFAULT_CMP0135=NEW

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run 10 GoogleTests
        run: ctest --test-dir build --output-on-failure -V

  arm64-cross-compile:
    name: ARM64 cross-compile (controller headers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake make

      - name: Cross-compile test_controller for ARM64
        run: |
          cmake -B build-arm64 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POLICY_DEFAULT_CMP0135=NEW \
                -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
                -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=aarch64
          cmake --build build-arm64 --target test_controller -j$(nproc)

  python-test:
    name: Python 25 pytest (geometry + DAQ + modbus sim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: Install deps
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest tests/ -v --tb=short

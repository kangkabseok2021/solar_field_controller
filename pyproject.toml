[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daq", "geometry", "test_bench"]

[project]
name = "solar-field-controller"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pymodbus>=3.7",
    "pyserial>=3.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.ruff]
line-length = 100
